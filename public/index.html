<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Cookie Checker Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #3b82f6;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #result { margin-top: 15px; font-size: 14px; word-break: break-word; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Roblox Checker</h2>
    <label for="cookieInput">Masukkan Cookie (.ROBLOSECURITY):</label>
    <textarea id="cookieInput" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
    <button onclick="checkCookie()">Cek Cookie</button>

    <div id="result"></div>
  </div>

  <script>
    async function checkCookie() {
      const cookie = document.getElementById('cookieInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!cookie) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = 'Masukkan cookie terlebih dahulu!';
        return;
      }

      resultDiv.className = '';
      resultDiv.innerHTML = 'Memeriksa...';

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cookie: cookie })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `
            <strong>Status: Cookie Valid!</strong><br>
            Username: ${data.user.name}<br>
            Display Name: ${data.user.displayName}<br>
            User ID: ${data.user.id}
          `;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `Error: ${data.error || 'Gagal mengecek cookie'}`;
        }
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = `Error: Gagal terhubung ke server.`;
      }
    }
  </script>
</body>
</html>
