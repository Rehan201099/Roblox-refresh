<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Bulk Cookie Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #151c2c;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 140px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 11px;
      font-family: monospace;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      background: #2563eb;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.download-btn {
      background: #16a34a;
      display: none;
    }
    button.download-btn:hover { background: #15803d; }
    
    #summary {
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }
    .list-box {
      margin-top: 12px;
      max-height: 280px;
      overflow-y: auto;
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #151c2c;
      border: 1px solid #1e293b;
    }
    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #334155;
      object-fit: cover;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .item-valid { color: #4ade80; font-weight: bold; }
    .item-dead { color: #f87171; font-weight: bold; }
    .error { color: #f87171; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Roblox Bulk Cookie Checker</h2>
    <label for="cookieInput" style="font-size: 12px; color: #94a3b8;">Masukkan Cookie (1 Cookie per baris):</label>
    <textarea id="cookieInput" placeholder="_|WARNING:-DO-NOT-SHARE-THIS...&#10;_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
    
    <div class="btn-group">
      <button onclick="checkBulkCookies()">Mulai Cek</button>
      <button id="dlBtn" class="download-btn" onclick="downloadValidTxt()">📥 Download Valid (.txt)</button>
    </div>

    <div id="summary"></div>
    <div id="resultList" class="list-box" style="display: none;"></div>
  </div>

  <script>
    let validList = [];

    async function checkBulkCookies() {
      const rawText = document.getElementById('cookieInput').value.trim();
      const summaryDiv = document.getElementById('summary');
      const resultListDiv = document.getElementById('resultList');
      const dlBtn = document.getElementById('dlBtn');

      if (!rawText) {
        alert('Masukkan minimal satu cookie!');
        return;
      }

      const cookiesArray = rawText.split('\n').map(c => c.trim()).filter(c => c.length > 0);

      summaryDiv.innerHTML = '<span style="color:#94a3b8;">Memeriksa ' + cookiesArray.length + ' cookie...</span>';
      resultListDiv.style.display = 'flex';
      resultListDiv.innerHTML = '';
      dlBtn.style.display = 'none';
      validList = [];

      try {
        const response = await fetch('/api/check-bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cookies: cookiesArray })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          let validCount = 0;
          let deadCount = 0;

          data.results.forEach((item, idx) => {
            if (item.valid) {
              validCount++;
              validList.push(item);
              resultListDiv.innerHTML += `
                <div class="item-card">
                  <img src="${item.avatar}" class="avatar-img" alt="avatar" />
                  <div class="item-info">
                    <span class="item-valid">[VALID] ${item.username}</span>
                    <span style="color:#94a3b8; font-size:11px;">User ID: ${item.userId}</span>
                  </div>
                </div>
              `;
            } else {
              deadCount++;
              resultListDiv.innerHTML += `
                <div class="item-card">
                  <div class="avatar-img" style="display:flex; align-items:center; justify-content:center; color:#f87171; font-weight:bold;">✕</div>
                  <div class="item-info">
                    <span class="item-dead">[DEAD] Cookie #${idx + 1}</span>
                    <span style="color:#64748b; font-size:11px;">Cookie tidak valid / kedaluwarsa</span>
                  </div>
                </div>
              `;
            }
          });

          summaryDiv.innerHTML = `Hasil: <span style="color:#4ade80;">${validCount} Valid</span> | <span style="color:#f87171;">${deadCount} Dead</span>`;

          if (validCount > 0) {
            dlBtn.style.display = 'block';
          }
        } else {
          summaryDiv.innerHTML = `<span class="error">${data.error || 'Gagal mengecek cookie'}</span>`;
        }
      } catch (err) {
        summaryDiv.innerHTML = `<span class="error">Gagal terhubung ke server.</span>`;
      }
    }

    function downloadValidTxt() {
      if (validList.length === 0) return;

      let textContent = validList.map(item => `${item.username}:${item.userId}:${item.cookie}`).join('\n');

      const blob = new Blob([textContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `valid_cookies_${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
