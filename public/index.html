<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Account Inspector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #151c2c;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 90px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 11px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #2563eb;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 15px; font-size: 14px; }
    .info-box {
      background: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.6;
    }
    .link-group {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .link-btn {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: #334155;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .link-btn:hover { background: #475569; }
    .badge-yes { color: #4ade80; font-weight: bold; }
    .badge-no { color: #f87171; font-weight: bold; }
    .error { color: #f87171; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Roblox Checker</h2>
    <label for="cookieInput" style="font-size: 12px; color: #94a3b8;">Masukkan Cookie (.ROBLOSECURITY):</label>
    <textarea id="cookieInput" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
    <button onclick="checkCookie()">Cek Akun</button>

    <div id="result"></div>
  </div>

  <script>
    async function checkCookie() {
      const cookie = document.getElementById('cookieInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!cookie) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = 'Masukkan cookie terlebih dahulu!';
        return;
      }

      resultDiv.className = '';
      resultDiv.innerHTML = '<div style="text-align:center; color:#94a3b8;">Memeriksa akun...</div>';

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cookie: cookie })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const u = data.user;
          resultDiv.innerHTML = `
            <div class="info-box">
              <strong>Status: Valid ✅</strong><br>
              Username: <strong>${u.name}</strong><br>
              Display Name: <strong>${u.displayName}</strong><br>
              User ID: <strong>${u.id}</strong><br>
              Robux: <strong style="color: #4ade80;">${u.robux}</strong><br>
              Trade Info: <strong>${u.trade}</strong><br>
              Premium: ${u.isPremium ? '<span class="badge-yes">Ya</span>' : '<span class="badge-no">Tidak</span>'}
              
              <div class="link-group">
                <a href="https://www.roblox.com/users/${u.id}/profile" target="_blank" class="link-btn">🔗 Cek Avatar</a>
                <a href="https://www.roblox.com/users/${u.id}/inventory" target="_blank" class="link-btn">📦 Cek Inventori</a>
              </div>
            </div>
          `;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `${data.error || 'Gagal mengecek cookie'}`;
        }
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = `Gagal terhubung ke server.`;
      }
    }
  </script>
</body>
</html>
